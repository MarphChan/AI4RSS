<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.5" stop-color="#0B2A5B"/>
      <stop offset="1" stop-color="#2A0F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#48C7FF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#2B74FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9BD7FF" stroke-opacity="0.08" stroke-width="2"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#9BD7FF" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53D3FF"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="512" cy="430" r="520" fill="url(#glow)" filter="url(#softBlur)"/>

  <g opacity="0.55">
    <path d="M120 740 C260 640, 360 700, 470 610 S700 520, 904 620" fill="none" stroke="#5CE0FF" stroke-opacity="0.18" stroke-width="4"/>
    <path d="M150 290 C260 340, 380 300, 500 360 S760 500, 900 420" fill="none" stroke="#FF8A3C" stroke-opacity="0.15" stroke-width="4"/>
    <path d="M220 860 L350 780 L430 820 L560 730 L690 780 L820 700" fill="none" stroke="#8CCBFF" stroke-opacity="0.14" stroke-width="4"/>
    <g fill="#9BD7FF" fill-opacity="0.22">
      <circle cx="350" cy="780" r="7"/>
      <circle cx="430" cy="820" r="7"/>
      <circle cx="560" cy="730" r="7"/>
      <circle cx="690" cy="780" r="7"/>
      <circle cx="820" cy="700" r="7"/>
      <circle cx="470" cy="610" r="7"/>
      <circle cx="500" cy="360" r="7"/>
      <circle cx="760" cy="500" r="7"/>
    </g>
  </g>

  <g>
    <rect x="136" y="220" width="752" height="584" rx="52" fill="#0B1833" fill-opacity="0.55" stroke="url(#strokeGrad)" stroke-opacity="0.35" stroke-width="4"/>
    <rect x="168" y="252" width="688" height="520" rx="42" fill="#071226" fill-opacity="0.35"/>
  </g>

  <g filter="url(#textGlow)">
    <text x="512" y="560" text-anchor="middle" dominant-baseline="middle"
      font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="172" font-weight="800" letter-spacing="6"
      fill="#EAF7FF">
      AI新闻
    </text>
    <text x="512" y="640" text-anchor="middle" dominant-baseline="middle"
      font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="36" font-weight="600" letter-spacing="10"
      fill="#7FD7FF" fill-opacity="0.85">
      AI NEWS
    </text>
  </g>

  <g opacity="0.65">
    <path d="M220 330 H804" stroke="#9BD7FF" stroke-opacity="0.14" stroke-width="3"/>
    <path d="M220 720 H804" stroke="#9BD7FF" stroke-opacity="0.12" stroke-width="3"/>
    <path d="M260 372 H500" stroke="#FF8A3C" stroke-opacity="0.12" stroke-width="4"/>
    <path d="M260 404 H420" stroke="#5CE0FF" stroke-opacity="0.12" stroke-width="4"/>
    <path d="M260 688 H460" stroke="#5CE0FF" stroke-opacity="0.10" stroke-width="4"/>
    <path d="M260 656 H540" stroke="#FF8A3C" stroke-opacity="0.10" stroke-width="4"/>
  </g>
</svg>
